<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Login | Play Boy</title>
  <link rel="icon" type="image/png" href="81c1d0412d8991a3ae21e2a3d37c46ab.jpg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .login-box {
      width: 320px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: none;
      background: #2f6fed;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
      text-align: center;
    }

    .hint-list {
      margin-top: 12px;
      padding-left: 20px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required>

      <button type="submit">Login</button>
      <div id="message" class="message"></div>
    </form>
    <ul id="ruleList" class="hint-list"></ul>
    <div class="hint">Demo only. No real authentication.</div>
  </div>

  <script>
    const usernamePattern = /^[a-z0-9]+$/i;
    const loginRules = [
      {
        ruleName: "Username 3+ characters",
        message: "Username must be at least 3 characters.",
        check: function (data) {
          return data.username.length >= 3;
        }
      },
      {
        ruleName: "Username: letters and numbers only",
        message: "Username can only use letters and numbers.",
        check: function (data) {
          return usernamePattern.test(data.username);
        }
      },
      {
        ruleName: "Password 8+ characters",
        message: "Password must be at least 8 characters.",
        check: function (data) {
          return data.password.length >= 8;
        }
      }
    ];

    const formElement = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const messageElement = document.getElementById("message");
    const ruleListElement = document.getElementById("ruleList");

    loginRules.forEach(function (rule) {
      const listItem = document.createElement("li");
      listItem.textContent = rule.ruleName;
      ruleListElement.appendChild(listItem);
    });

    formElement.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      const loginData = {
        username: username,
        password: password
      };

      const failedRule = loginRules.find(function (rule) {
        return !rule.check(loginData);
      });

      if (failedRule) {
        messageElement.textContent = failedRule.message;
        messageElement.style.color = "red";
        return;
      }

      messageElement.textContent = "Login successful! Redirecting...";
      messageElement.style.color = "green";
      setTimeout(function () {
        window.location.href = "mainpage.html";
      }, 800);
    });
  </script>
</body>
</html>

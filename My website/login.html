<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Login | Play Boy</title>
  <link rel="icon" type="image/png" href="81c1d0412d8991a3ae21e2a3d37c46ab.jpg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .login-box {
      width: 320px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 20px;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: none;
      background: #2f6fed;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="student" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="1234" required>

      <button type="submit">Login</button>
      <div id="message" class="message"></div>
    </form>
    <div class="hint">Demo users: student/1234 or player/5678</div>
  </div>

  <script>
    const rawUsers = [
      { name: "student", pass: "1234" },
      { name: "player", pass: "5678" }
    ];

    const users = rawUsers.map(function (item) {
      return {
        name: item.name,
        password: item.pass,
        checkPassword: function (inputPassword) {
          return this.password === inputPassword;
        }
      };
    });

    const formPointer = document.getElementById("loginForm");
    const usernamePointer = document.getElementById("username");
    const passwordPointer = document.getElementById("password");
    const messagePointer = document.getElementById("message");

    formPointer.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = usernamePointer.value.trim();
      const password = passwordPointer.value.trim();

      if (username === "" || password === "") {
        messagePointer.textContent = "Please fill all fields.";
        messagePointer.style.color = "red";
        return;
      }

      const foundUser = users.find(function (user) {
        return user.name === username;
      });

      if (foundUser && foundUser.checkPassword(password)) {
        messagePointer.textContent = "Login successful! Redirecting...";
        messagePointer.style.color = "green";
        setTimeout(function () {
          window.location.href = "mainpage.html";
        }, 800);
      } else {
        messagePointer.textContent = "Invalid username or password.";
        messagePointer.style.color = "red";
      }
    });
  </script>
</body>
</html>
